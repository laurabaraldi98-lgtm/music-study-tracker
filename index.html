<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Study Tracker</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="sign-in-container"></div>

    <main id="app-container">
        <div id="user-button-container"></div>

        <h1>Music Study Tracker</h1>

        <p>
            Traccia i progressi nei tuoi esercizi musicali.
        </p>

        <h2>Nuovo dettato</h2>

        <div class="form-group">
            <label for="dictation-collection">
                Raccolta
            </label>

            <select id="dictation-collection">
                <option value="">
                    Nessuna raccolta
                </option>
            </select>
        </div>

        <button id="manage-collections-button" type="button">
            Gestisci raccolte
        </button>

        <div id="collection-manager" hidden>
            <label for="new-collection">
                Nuova raccolta
            </label>

            <div class="new-collection-row">
                <input type="text" id="new-collection" placeholder="Es. Corali di Bach">

                <button id="add-collection-button" type="button">
                    Aggiungi
                </button>
            </div>

            <div id="collections-list"></div>
        </div>

        <div class="form-group">
            <label for="dictation-date">
                Data
            </label>

            <input type="date" id="dictation-date">
        </div>

        <div class="form-group">
            <label for="dictation-name">
                Nome del dettato
            </label>

            <input type="text" id="dictation-name" placeholder="Es. Dettato melodico n. 1">
        </div>

        <div class="form-group">
            <label for="youtube-link">
                Link YouTube
            </label>

            <input type="url" id="youtube-link" placeholder="https://youtube.com/...">
        </div>

        <div class="form-group">
            <label for="dictation-type">
                Tipo di dettato
            </label>

            <select id="dictation-type">
                <option value="">
                    Seleziona un tipo
                </option>
            </select>
        </div>

        <button id="manage-dictation-types-button" type="button">
            Gestisci tipi di dettato
        </button>

        <div id="dictation-type-manager" hidden>
            <label for="new-dictation-type">
                Nuovo tipo di dettato
            </label>

            <div class="new-dictation-type-row">
                <input type="text" id="new-dictation-type" maxlength="50" placeholder="Es. Contrappunto">

                <button id="add-dictation-type-button" type="button">
                    Aggiungi
                </button>
            </div>

            <div id="dictation-types-list"></div>
        </div>

        <p id="categories-question" hidden>
            Cosa ho sentito correttamente?
        </p>

        <div id="category-manager" hidden>
            <label for="new-category">
                Nuova categoria
            </label>

            <div class="new-category-row">
                <input type="text" id="new-category" placeholder="Es. Suddivisione">

                <button id="add-category-button" type="button">
                    Aggiungi
                </button>
            </div>
        </div>

        <div id="categories-container"></div>

        <button id="manage-categories-button" type="button" hidden>
            Gestisci categorie
        </button>

        <button id="save-button" type="button">
            Salva dettato
        </button>

        <button id="show-saved-button" type="button">
            Vedi dettati salvati
        </button>

        <section id="saved-dictations-section" hidden>
            <h2>Dettati salvati</h2>

            <div class="form-group">
                <label for="saved-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="saved-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="saved-dictations-container"></div>
        </section>

        <button id="show-calendar-button" type="button">
            Vedi calendario
        </button>

        <section id="calendar-section" hidden>
            <h2>Calendario</h2>

            <div class="form-group">
                <label for="calendar-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="calendar-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="calendar-container"></div>
        </section>

        <button id="show-statistics-button" type="button">
            Vedi statistiche
        </button>

        <section id="statistics-section" hidden>
            <h2>Statistiche</h2>

            <div class="form-group">
                <label for="statistics-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="statistics-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="statistics-container"></div>
        </section>

        <button id="show-practice-report-button" type="button">
            Vedi report progressi
        </button>

        <section id="practice-report-section" hidden>
            <h2>Report progressi</h2>

            <div class="form-group">
                <label for="practice-report-period">
                    Periodo
                </label>

                <select id="practice-report-period">
                    <option value="current-month">
                        Mese corrente
                    </option>

                    <option value="previous-month">
                        Mese precedente
                    </option>

                    <option value="3-months">
                        Ultimi 3 mesi
                    </option>

                    <option value="6-months" selected>
                        Ultimi 6 mesi
                    </option>

                    <option value="all">
                        Tutto il periodo
                    </option>

                    <option value="custom">
                        Periodo personalizzato
                    </option>
                </select>
            </div>

            <div id="practice-report-custom-period" hidden>
                <div class="form-group">
                    <label for="practice-report-from">
                        Dal
                    </label>

                    <input type="date" id="practice-report-from">
                </div>

                <div class="form-group">
                    <label for="practice-report-to">
                        Al
                    </label>

                    <input type="date" id="practice-report-to">
                </div>
            </div>

            <div class="form-group">
                <label for="practice-report-collection">
                    Raccolta
                </label>

                <select id="practice-report-collection">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="practice-report-type">
                    Tipo di dettato
                </label>

                <select id="practice-report-type">
                    <option value="">
                        Tutti i tipi
                    </option>
                </select>
            </div>

            <div id="practice-report-summary"></div>
            <div id="practice-report-months"></div>
            <div id="practice-report-types"></div>
        </section>

        <div id="calendar-modal" class="modal" hidden>
            <div class="modal-content">
                <button id="close-calendar-modal" class="modal-close-button" type="button" aria-label="Chiudi">
                    ×
                </button>

                <h3 id="calendar-modal-title"></h3>

                <div id="calendar-modal-dictations"></div>
            </div>
        </div>
    </main>

    <script defer crossorigin="anonymous"
        src="https://fast-collie-31.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript"></script>

    <script defer crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZmFzdC1jb2xsaWUtMzEuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://fast-collie-31.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript"></script>

    <script defer src="auth.js"></script>

    <script src="api.js"></script>
    <script src="collections.js"></script>
    <script src="dictation-types.js"></script>
    <script src="categories.js"></script>
    <script src="dictations.js"></script>
    <script src="calendar.js"></script>
    <script src="statistics.js"></script>
    <script src="practice-report.js"></script>
</body>

</html>
