<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Study Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Music Study Tracker</h1>

        <p>
            Traccia i progressi nei tuoi esercizi musicali.
        </p>

        <h2>Nuovo dettato</h2>

        <div class="form-group">
            <label for="dictation-collection">
                Raccolta
            </label>

            <select id="dictation-collection">
                <option value="">
                    Nessuna raccolta
                </option>
            </select>
        </div>

        <button id="manage-collections-button" type="button">
            Gestisci raccolte
        </button>

        <div id="collection-manager" hidden>
            <label for="new-collection">
                Nuova raccolta
            </label>

            <div class="new-collection-row">
                <input type="text" id="new-collection" placeholder="Es. Corali di Bach">

                <button id="add-collection-button" type="button">
                    Aggiungi
                </button>
            </div>

            <div id="collections-list"></div>
        </div>

        <div class="form-group">
            <label for="dictation-date">
                Data
            </label>

            <input type="date" id="dictation-date">
        </div>

        <div class="form-group">
            <label for="dictation-name">
                Nome del dettato
            </label>

            <input type="text" id="dictation-name" placeholder="Es. Dettato melodico n. 1">
        </div>

        <div class="form-group">
            <label for="youtube-link">
                Link YouTube
            </label>

            <input type="url" id="youtube-link" placeholder="https://youtube.com/...">
        </div>

        <div class="form-group">
            <label for="dictation-type">
                Tipo di dettato
            </label>

            <select id="dictation-type">
                <option value="">
                    Seleziona un tipo
                </option>

                <option value="rhythmic">
                    Ritmico
                </option>

                <option value="melodic">
                    Melodico
                </option>

                <option value="harmonic">
                    Armonico
                </option>
            </select>
        </div>

        <p id="categories-question" hidden>
            Cosa ho sentito correttamente?
        </p>

        <div id="category-manager" hidden>
            <label for="new-category">
                Nuova categoria
            </label>

            <div class="new-category-row">
                <input type="text" id="new-category" placeholder="Es. Suddivisione">

                <button id="add-category-button" type="button">
                    Aggiungi
                </button>
            </div>
        </div>

        <div id="categories-container"></div>

        <button id="manage-categories-button" type="button" hidden>
            Gestisci categorie
        </button>

        <button id="save-button" type="button">
            Salva dettato
        </button>

        <button id="show-saved-button" type="button">
            Vedi dettati salvati
        </button>

        <section id="saved-dictations-section" hidden>
            <h2>Dettati salvati</h2>

            <div class="form-group">
                <label for="saved-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="saved-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="saved-dictations-container"></div>
        </section>

        <button id="show-calendar-button" type="button">
            Vedi calendario
        </button>

        <section id="calendar-section" hidden>
            <h2>Calendario</h2>

            <div class="form-group">
                <label for="calendar-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="calendar-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="calendar-container"></div>
        </section>

        <button id="show-statistics-button" type="button">
            Vedi statistiche
        </button>

        <section id="statistics-section" hidden>
            <h2>Statistiche</h2>

            <div class="form-group">
                <label for="statistics-collection-filter">
                    Filtra per raccolta
                </label>

                <select id="statistics-collection-filter">
                    <option value="">
                        Tutte le raccolte
                    </option>
                </select>
            </div>

            <div id="statistics-container"></div>
        </section>

        <div id="calendar-modal" class="modal" hidden>
            <div class="modal-content">
                <button id="close-calendar-modal" class="modal-close-button" type="button" aria-label="Chiudi">
                    ×
                </button>

                <h3 id="calendar-modal-title"></h3>

                <div id="calendar-modal-dictations"></div>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="collections.js"></script>
    <script src="categories.js"></script>
    <script src="script.js"></script>
    <script src="calendar.js"></script>
    <script src="statistics.js"></script>
</body>

</html>
